name: Atlas art direction — browser checks
on:
  push:
    branches: ['experiment/atlas-newspaper-20261005']
    paths: ['atlas*','tests/atlas.test.mjs','tests/build-atlas-assets.mjs','.github/workflows/atlas189.yml']
permissions:
  contents: write
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright sharp
      - run: npx playwright install --with-deps chromium
      - run: node tests/build-atlas-assets.mjs
      - run: node tests/atlas.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-art-browser
          path: atlas-shots/
      - name: Commit verified art and screenshots
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const {owner,repo}=context.repo,branch=context.ref.replace('refs/heads/','');
            const head=(await github.rest.git.getRef({owner,repo,ref:'heads/'+branch})).data.object.sha;
            if(head!==context.sha){core.info('Branch advanced; artifacts kept.');return;}
            const commit=(await github.rest.git.getCommit({owner,repo,commit_sha:head})).data,entries=[];
            for(const dir of ['assets/atlas','atlas-shots']){
              if(!fs.existsSync(dir))continue;
              for(const name of fs.readdirSync(dir)){
                const blob=(await github.rest.git.createBlob({owner,repo,encoding:'base64',content:fs.readFileSync(dir+'/'+name).toString('base64')})).data;
                entries.push({path:dir+'/'+name,mode:'100644',type:'blob',sha:blob.sha});
              }
            }
            const tree=(await github.rest.git.createTree({owner,repo,base_tree:commit.tree.sha,tree:entries})).data;
            const next=(await github.rest.git.createCommit({owner,repo,message:'Store historical artwork and browser inspection captures',tree:tree.sha,parents:[head]})).data;
            await github.rest.git.updateRef({owner,repo,ref:'heads/'+branch,sha:next.sha,force:false});
