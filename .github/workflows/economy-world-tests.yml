name: Economy and demography tests
on:
  push:
    branches: [main, experiment/economy-world]
    paths: ['economy-*.js', 'economy-world.html', 'economy-world.css', 'tests/economy-world.test.mjs', 'tests/fixtures/economy-luna.json', '.github/workflows/economy-world-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/political-world.test.mjs
      - run: node tests/economy-world.test.mjs
