name: One-shot conquest and world balance playtest
on:
  push:
    branches: [feature/conquest-world-balance-20261004]
    paths: ['.github/workflows/live-conquest-20261004.yml']
permissions:
  contents: read
jobs:
  expansion:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CAMPAIGN: expansion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/live-conquest-campaigns.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conquest-expansion
          path: conquest-output-expansion/
  balance:
    if: github.run_attempt == 1
    needs: expansion
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CAMPAIGN: balance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: conquest-expansion
          path: conquest-seed
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/live-conquest-campaigns.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conquest-balance
          path: conquest-output-balance/
