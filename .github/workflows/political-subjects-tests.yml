name: Political cabinets and conferences
on:
  push:
    branches: [main, experiment/political-subjects, experiment/interface-motion]
  pull_request:
jobs:
  political-world:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check game-motion.js
      - run: node --check economy-map.js
      - run: node tests/political-world.test.mjs
      - run: node tests/economy-world.test.mjs
      - run: node tests/news-continuity.test.mjs
      - run: node tests/strategy-contracts.test.mjs
      - run: node tests/political-subjects.test.mjs
