name: Historical visual lab — browser checks
on:
  push:
    branches: ['experiment/historical-visuals-20261005']
    paths:
      - 'visual-lab*'
      - 'tests/build-visual-physical.mjs'
      - 'visual-gallery.html'
      - 'economy-map.js'
      - 'economy-game.js'
      - 'tests/visual-lab.test.mjs'
      - '.github/workflows/visual-lab.yml'
permissions:
  contents: write
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/build-visual-physical.mjs
      - run: node tests/visual-lab.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-lab-browser
          path: visual-shots/
      - name: Save verified comparison screenshots to experimental branch
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const {owner,repo}=context.repo,branch=context.ref.replace('refs/heads/','');
            const head=(await github.rest.git.getRef({owner,repo,ref:'heads/'+branch})).data.object.sha;
            if(head!==context.sha){core.info('Branch advanced; screenshots retained in workflow artifact.');return;}
            const commit=(await github.rest.git.getCommit({owner,repo,commit_sha:head})).data;
            const entries=[];
            for(const name of fs.readdirSync('visual-shots').filter(n=>/\.(png|json)$/.test(n))){
              const blob=(await github.rest.git.createBlob({owner,repo,encoding:'base64',content:fs.readFileSync('visual-shots/'+name).toString('base64')})).data;
              entries.push({path:'visual-shots/'+name,mode:'100644',type:'blob',sha:blob.sha});
            }
            const physical=(await github.rest.git.createBlob({owner,repo,encoding:'base64',content:fs.readFileSync('visual-physical.json').toString('base64')})).data;
            entries.push({path:'visual-physical.json',mode:'100644',type:'blob',sha:physical.sha});
            const tree=(await github.rest.git.createTree({owner,repo,base_tree:commit.tree.sha,tree:entries})).data;
            const next=(await github.rest.git.createCommit({owner,repo,message:'docs: capture verified visual lab screenshots',tree:tree.sha,parents:[head]})).data;
            await github.rest.git.updateRef({owner,repo,ref:'heads/'+branch,sha:next.sha,force:false});
