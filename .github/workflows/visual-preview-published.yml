name: Published visual preview — no AI calls
on:
  push:
    branches: [main]
    paths:
      - 'preview/visual-20261005/**'
      - '.github/workflows/visual-preview-published.yml'
permissions:
  contents: read
jobs:
  public:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/historical-visuals-20261005
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - name: Wait for the Pages snapshot
        run: |
          node --input-type=module -e "for(let i=0;i<60;i++){const r=await fetch('https://zhank478.github.io/grand-strategy/preview/visual-20261005/visual-lab.html');if(r.ok){console.log('Preview published');process.exit(0)}await new Promise(r=>setTimeout(r,3000));}throw Error('Preview was not published');"
      - run: node tests/visual-lab.test.mjs
        env:
          VISUAL_TEST_URL: https://zhank478.github.io/grand-strategy/preview/visual-20261005/visual-lab.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-visual-preview
          path: visual-shots/
